# Copy to backend/config/application.properties and fill in.
#
# Spring Boot reads ./config/application.properties ahead of the packaged one and
# merges them per key, so only what you set here is overridden. That directory is
# in .gitignore: real credentials must never reach the repository.
#
# Run the backend from the `backend` directory for this file to be picked up.

# ----- Outgoing mail -----
# Sends address confirmations and invitations. Leave the host empty and the links
# are written to the server log instead — enough locally, useless to anyone else.
# Microsoft 365: smtp.office365.com:587   Google Workspace: smtp.gmail.com:587
# Both refuse an ordinary account password: create an app password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=reports@yourdomain.com
spring.mail.password=your-app-password
app.mail.from=reports@yourdomain.com

# ----- Encryption key for stored mailbox passwords -----
# A mailbox password must be presented to IMAP on every run, so unlike an account
# password it cannot be hashed. Without a key here the application refuses to store
# one rather than keeping it in clear. Changing it makes every stored one unreadable.
#   openssl rand -base64 32
app.secrets.key=

# ----- Token signing key -----
# Without one, a throwaway key is generated at startup: every session ends when the
# process restarts, and the key appears in the log.
#   openssl rand -base64 48
app.jwt.secret=

# ----- Platform console -----
# Existing usernames that also operate the service. Grants no new login: sign in as
# usual and a "Platform" entry appears. Deliberately outside the database, so that
# being an organization administrator can never become a way across every tenant.
app.platform.operators=
