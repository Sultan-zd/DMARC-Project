# Test profile: layered on top of the main application.properties.
#
# The suite must not need a running MariaDB server, and must never touch the
# developer's real data, so it runs against a throwaway in-memory database.
spring.datasource.url=jdbc:h2:mem:dmarc-test;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mailbox polling stays off during tests.
app.imap.password=

# Seeding must not run during tests: it creates accounts with a well-known password.
app.demo-data.enabled=false

# Fixed signing key, so tests never depend on a generated one. Must be base64 and
# at least 32 bytes once decoded; JwtTokenProvider rejects anything shorter.
app.jwt.secret=ZG1hcmMtZGFzaGJvYXJkIHRlc3Qgc2lnbmluZyBrZXksIG5vdCB1c2VkIG91dHNpZGUgdGVzdHM=
