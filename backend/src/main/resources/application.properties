server.port=8000
spring.application.name=dmarc-dashboard

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/dmarc_dashboard
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWp3dA==
app.jwt.expiration-ms=3600000

# IMAP
app.imap.server=imap.teknologiia.com
app.imap.port=993
app.imap.username=dmarcreports@teknologiia.com
app.imap.password=
app.imap.use-ssl=true
app.imap.polling-interval-minutes=15

# Admin
app.admin.username=admin
app.admin.password=Admin@Dmarc2024!

# Alerts
app.alert.failure-rate-threshold=0.3
app.alert.spike-multiplier=2.0

# CORS
app.cors.origins=http://localhost:5173,http://localhost:3000

# Springdoc
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/docs
