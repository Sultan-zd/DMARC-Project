server.port=8000
spring.application.name=dmarc-dashboard

# ----- Database (MariaDB / MySQL) -----
# Defaults match a stock XAMPP install so the app runs with no extra setup.
# Every value is overridable by environment variable: never put real credentials
# in this file, it is tracked in git.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/dmarc_dashboard}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# ----- JWT -----
# Deliberately empty: this file is tracked in git, and whoever holds this key can
# forge a token for any user without knowing a password. Supply it via the
# environment. With no value set, a throwaway key is generated at startup and all
# sessions end when the process restarts.
#   JWT_SECRET=$(openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Public domain scanner
# Burst allowance per IP, and the sustained rate it refills at.
app.ratelimit.scan.capacity=10
app.ratelimit.scan.refill-per-minute=5
# Reuse a stored result for this long instead of re-querying DNS.
app.public-scan.cache-minutes=15
# Only enable behind a proxy you control — a tunnel, a load balancer. Reachable
# directly, nothing writes X-Forwarded-For except the caller, and believing it
# would let anyone vary the header to get a fresh rate-limit bucket.
app.trust-proxy-headers=${APP_TRUST_PROXY_HEADERS:false}

# Report uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# ----- Mailbox collection -----
# The mailbox itself is no longer configured here. It belongs to an organization
# and is entered from the Administration screen, because a single server-wide
# mailbox meant every tenant's collection run opened the same inbox — and whichever
# one pressed the button took ownership of what it found.
#
# Only the schedule is global.
app.imap.polling-interval-minutes=${IMAP_POLL_MINUTES:15}
# Delay before the first scheduled run, so a restart does not open every mailbox
# at once while the application is still starting.
app.imap.initial-delay-ms=${IMAP_INITIAL_DELAY_MS:60000}

# ----- Encryption key for stored secrets -----
# A mailbox password has to be presented to an IMAP host on every run, so unlike an
# account password it cannot be hashed — it is stored encrypted with this key.
# Without one, the application refuses to store mailbox passwords at all rather
# than keeping them in clear.
#   SECRETS_KEY=$(openssl rand -base64 32)
# Changing it makes every stored mailbox password unreadable.
app.secrets.key=${SECRETS_KEY:}

# ----- Platform console -----
# Usernames allowed to see the service-wide console: counts across every tenant,
# runtime health, deployment checks. Read from here and never from the database,
# so an organization administrator cannot grant it to themselves.
# Empty means nobody qualifies and the console is absent.
#   PLATFORM_OPERATORS=barhoum,sultan
app.platform.operators=${PLATFORM_OPERATORS:}

# ----- Bootstrap administrator -----
# Created only when the account does not already exist. When ADMIN_PASSWORD is
# unset a strong one is generated and printed once in the startup log.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@teknologiia.com}
app.admin.organization=${ADMIN_ORGANIZATION:Teknologiia}

# Alerts
app.alert.failure-rate-threshold=0.3
app.alert.spike-multiplier=2.0

# CORS
# Only needed while the interface runs on its own Vite port. Served from this
# process — which is what go-online.ps1 sets up — the browser makes no
# cross-origin call at all.
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Springdoc
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/docs

# ----- Outgoing mail -----
# Sends the address-confirmation and invitation messages. Leave spring.mail.host
# empty and the links are written to the log instead, which is enough for local
# work but means nobody outside the server ever receives them.
#
# Microsoft 365:   smtp.office365.com : 587, STARTTLS
# Google Workspace: smtp.gmail.com    : 587, STARTTLS
#
# Both refuse an ordinary account password over SMTP. Supply an app password via
# MAIL_PASSWORD. On Microsoft 365, SMTP AUTH also has to be enabled for the
# mailbox — it is off by default on tenants created since 2020.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# The address recipients see. Must be one the mailbox is allowed to send as.
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Teknologiia DMARC}

# Self-service registration
app.registration.token-ttl-hours=24

# Forgotten passwords
# Deliberately shorter than the sign-up link above. A confirmation link sitting
# unread in an inbox costs nothing; a link that rewrites a password is worth an
# hour and no more.
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:60}
# The base address links point at. Must be the address users actually reach.
app.public-url=${PUBLIC_URL:http://localhost:5173}

# Error responses
# Exception text is never echoed to callers; ApiExceptionHandler decides exactly
# what is returned, and unexpected failures are logged rather than exposed.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ----- Backups -----
# Where dumps are written. Empty disables backups entirely, which is how this runs
# outside a container -- the Platform page then says so rather than pretending.
# In the image this is /backups, mounted to a named volume by docker-compose.
app.backup.directory=${BACKUP_DIR:}
# How many to keep. Older ones are removed after each successful run.
app.backup.keep=${BACKUP_KEEP:14}
# How often the scheduled run fires. The Platform page turns red at twice this,
# because one missed run is a restart and two is a pattern.
app.backup.interval-hours=${BACKUP_INTERVAL_HOURS:24}
# Delay before the first run after start, so a restart loop cannot produce one
# backup per crash.
app.backup.initial-delay-ms=${BACKUP_INITIAL_DELAY_MS:300000}

# Team invitations
# Links are written to the log until SMTP is configured.
app.invitation.ttl-hours=168
